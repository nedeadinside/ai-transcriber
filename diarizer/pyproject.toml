[project]
name = "diarizer"
version = "0.1.0"
description = "Speaker diarization via pyannote"
authors = [{ name = "nedeadinside", email = "aquvva67@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "core",
    "pyannote.audio>=4.0,<5.0",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "arq>=0.26,<0.27",
    "pydantic>=2.9,<3.0",
    "pydantic-settings[yaml]>=2.10,<3.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.*"]
gpu = ["torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.*"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
