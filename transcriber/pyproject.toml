[project]
name = "transcriber"
version = "0.1.0"
description = "Audio transcription via a Whisper ASR service, with optional diarization and LLM post-processing"
authors = [{ name = "nedeadinside", email = "aquvva67@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "core",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "arq>=0.26,<0.27",
    "pydantic>=2.9,<3.0",
    "pydantic-settings[yaml]>=2.10,<3.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27,<0.29",
    "langchain-core>=1.4,<2.0",
    # init_chat_model: one factory, provider-independent parameter names.
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
]

[tool.uv]
package = false
