queue:
  redis_url: redis://diarizer-redis:6379/0
  job_timeout: 3600
  concurrency: 1

model:
  checkpoint: pyannote/speaker-diarization-3.1

inference:
  device: cpu

audio:
  spool_dir: /data/spool
  allowed_formats: [wav, mp3, m4a, flac, ogg]
  max_duration_sec: 7200
  max_upload_mb: 200

logging:
  level: INFO
