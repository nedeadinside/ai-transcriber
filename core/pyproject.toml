[project]
name = "core"
version = "0.1.0"
description = "Shared API, config, and audio building blocks for the transcriber services"
authors = [{ name = "nedeadinside", email = "aquvva67@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "arq>=0.26,<0.27",
    "pydantic>=2.9,<3.0",
    "pydantic-settings[yaml]>=2.10,<3.0",
    "python-multipart>=0.0.12",
    # 14.4.0 ships no wheels at all; 15+ ships manylinux wheels with ffmpeg bundled.
    "av>=15.0,<19.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
