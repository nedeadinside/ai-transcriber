[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server that gives AI agents transcription of files from a shared pool"
authors = [{ name = "nedeadinside", email = "aquvva67@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=2.3,<3.0",
    "httpx>=0.27,<0.29",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings[yaml]>=2.10,<3.0",
]

[tool.uv]
package = false
