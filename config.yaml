diarizer:
  queue:
    job_timeout: 14400
    concurrency: 1

  model:
    checkpoint: pyannote/speaker-diarization-community-1

  inference:
    device: cpu

  audio:
    allowed_formats: [wav, mp3, m4a, flac, ogg]
    max_duration_sec: 14400
    max_upload_mb: 1024

  logging:
    level: INFO

transcriber:
  queue:
    job_timeout: 14400
    concurrency: 1

  whisper:
    language: null
    vad_filter: true
    timeout_sec: 14400

  diarizer:
    poll_interval_sec: 2
    timeout_sec: 14400

  llm:
    provider: openai # openai | ollama
    model: gpt-oss:120b
    prompts_file: /app/prompts.yaml
    temperature: 0.3
    params:
      base_url: https://ollama.com/v1
      timeout: 60
      max_retries: 2

  audio:
    allowed_formats: [
        wav, mp3, m4a, flac, ogg, oga, opus, aac, wma, amr, aiff, aif, mka, caf,
        mp4, m4v, mov, mkv, webm, avi, wmv, flv, mpg, mpeg, ts, mts, 3gp,
      ]
    max_duration_sec: 14400
    max_upload_mb: 4096

  logging:
    level: INFO

mcp:
  transcriber:
    poll_interval_sec: 5
    timeout_sec: 1800

  logging:
    level: INFO
